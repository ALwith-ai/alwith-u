<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ALwith U</title>
    <style>
      /* Cold-start placeholder, verbatim from ALwith Desktop's __boot-loader: shown only until
         React mounts (the brand stroked in purple, then filled, over the window vibrancy). */
      html,
      body {
        margin: 0;
        padding: 0;
      }
      .__boot-loader {
        display: flex;
        width: 100vw;
        height: 100vh;
        align-items: center;
        justify-content: center;
        background: transparent;
        -webkit-user-select: none;
        user-select: none;
        cursor: default;
      }
      .__boot-logo {
        width: 50vw;
        max-width: 540px;
        height: auto;
      }
      .__boot-logo text {
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        font-size: 160px;
        font-weight: 700;
        fill: transparent;
        stroke: #a227ff;
        stroke-width: 1.5;
        stroke-dasharray: 2600;
        stroke-dashoffset: 2600;
        animation: __boot-draw 3s linear forwards;
      }
      @keyframes __boot-draw {
        0% {
          stroke-dashoffset: 2600;
          fill: transparent;
        }
        70% {
          stroke-dashoffset: 0;
          fill: transparent;
        }
        80% {
          stroke-dashoffset: 0;
          fill: transparent;
        }
        100% {
          stroke-dashoffset: 0;
          fill: #a227ff;
        }
      }
    </style>
    <script>
      // First paint uses the theme the user chose last time (the ThemeProvider writes it
      // to localStorage), so the splash and the app never flash the wrong scheme.
      try {
        var theme = localStorage.getItem("theme")
        var dark = theme === "dark" || (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.classList.add(dark ? "dark" : "light")
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root">
      <div class="__boot-loader" data-tauri-drag-region>
        <svg class="__boot-logo" viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg">
          <text x="50%" y="50%" dominant-baseline="central" text-anchor="middle">ΛLwith</text>
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
