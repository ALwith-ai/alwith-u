<style>
  /* Match component icons for feature groups at the same navigation level. */
  .sidebar-item > [role="gridcell"] > div:has(> span > .sidebar-feature-label) > button[slot="chevron"] .static-only > svg {
    display: none;
  }
  /* The label then starts where the hidden icon was, as the replacement icon is part of the label. */
  .sidebar-item > [role="gridcell"] > div > span:has(> .sidebar-feature-label) {
    margin-left: 0;
  }
  .sidebar-feature-label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .sidebar-feature-label > svg {
    flex-shrink: 0;
    align-self: flex-start;
    margin-top: 2px;
    color: #029cfd;
  }
  .sidebar-item[data-selected="true"] .sidebar-feature-label > svg {
    color: inherit;
  }
  .sidebar-category-label > svg {
    color: #6f2cac;
  }
</style>
