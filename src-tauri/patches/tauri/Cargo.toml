default = [
    "compression",
    "common-controls-v6",
    "dynamic-acl",
]
devtools = ["tauri-runtime/devtools"]
dynamic-acl = []
gtk3 = [
    "dep:gtk",
    "muda/gtk3",
]
gtk4 = [
    "dep:gtk4",
    "muda/gtk4",
]
image-ico = ["image/ico"]
image-png = ["image/png"]
isolation = [
    "tauri-utils/isolation",
    "tauri-macros/isolation",
    "uuid",
]
linux-libappindicator = ["tray-icon?/libappindicator"]
