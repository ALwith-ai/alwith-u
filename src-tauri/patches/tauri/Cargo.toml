    "tray-icon?/muda-libxdo",
    "muda/libxdo",
]
native-tls = ["reqwest/native-tls"]
native-tls-vendored = ["reqwest/native-tls-vendored"]
process-relaunch-dangerous-allow-symlink-macos = ["tauri-utils/process-relaunch-dangerous-allow-symlink-macos"]
protocol-asset = ["http-range"]
rustls-tls = [
    "reqwest/rustls-no-provider",
    "dep:rustls",
]
specta = ["dep:specta"]
test = []
tracing = [
    "dep:tracing",
    "tauri-macros/tracing",
]
tray-icon = [
    "dep:tray-icon",
    "tray-icon?/ksni",
]
unstable = []
webview-data-url = [
    "data-url",
    "tauri-utils/html-manipulation-2",
]

[lib]
name = "tauri"
path = "src/lib.rs"

[[test]]
name = "restart"
path = "tests/restart.rs"

