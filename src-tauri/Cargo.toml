[package]
name = "alwith-u"
version = "0.1.1"
description = "An independent desktop client for the OpenAI Codex CLI"
authors = ["alwith.ai"]
license = "Apache-2.0"
edition = "2024"

[lib]
name = "alwith_u_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
hasgard-testing = ["dep:tauri-plugin-hasgard"]

[dependencies]
alwith-api = { path = "../node_modules/@alwith/api/rust" }
alwith-extension = { path = "../node_modules/@alwith/module-extension/rust", features = ["tauri"] }
tempfile = "3"
tauri-plugin-hasgard = { version = "0.4.1", optional = true }
libloading = "0.8"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-log = "2"
# Extensions share this transport with the host; never attach a shared cookie jar.
tauri-plugin-http = { version = "2", default-features = false, features = ["rustls-tls", "http2", "charset", "system-proxy"] }
tauri-plugin-os = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
base64 = "0.23"
minisign-verify = "0.2"
semver = "1"
sys-locale = "0.3"
tokio = { version = "1", features = ["sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSNotification", "NSGeometry"] }
# Same reviewed revision as Desktop's nonactivating chat panel implementation.
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "a3122e894383aa068ec5365a42994e3ac94ba1b6" }
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSResponder", "NSGraphics"] }

[profile.dev]
debug = "line-tables-only"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
