[package]
name = "alwith-u"
version = "26.11.7"
description = "An independent desktop client for the OpenAI Codex CLI"
authors = ["alwith.ai"]
license = "Apache-2.0"
edition = "2024"

[lib]
name = "alwith_u_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "3.0.0-alpha.4", features = [] }

[features]
hasgard-testing = ["dep:tauri-plugin-hasgard"]

[dependencies]
alwith-enterprise-client = { path = "../node_modules/@alwith/enterprise-client/rust" }
alwith-editor = "0.6"
alwith-desktop-shell = "0.6"
keepawake = "0.6"
alwith-browser = "0.6"
alwith-mobile = "0.6"
atlas-tauri = { version = "0.1", features = ["specta"] }
alwith-store = "0.6"
alwith-auth = "0.6"
alwith-computer = "0.6.3"
alwith-device = "0.6"
alwith-voice = "0.6"
alwith-gamepad = "0.6"
alwith-installed-apps = "0.6"
alwith-fs = "0.6"
alwith-drive = "0.6"
# The ALwith account gateway (`init_with_account`); the application selects reqwest's TLS backend.
alwith-chat = { version = "0.6.5", default-features = false }
alwith-api = { path = "../node_modules/@alwith/api/rust" }
alwith-extension = "0.6"
tempfile = "3"
sha2 = "0.11"
hex = "0.4"
regex = "1"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tauri-plugin-hasgard = { version = "0.6.0-alpha.2", optional = true }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The app alone selects rustls with aws-lc-rs; libraries and Tauri plugins inherit it through feature unification.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
# Tauri 3 keeps its runtime in a separate crate; alpha.4 provides transparency without a private-API feature.
tauri = { version = "3.0.0-alpha.5", features = ["protocol-asset", "specta", "tray-icon"] }
specta = { version = "2.0.0-rc.27", features = ["derive", "function"] }
tauri3-specta = "0.1.0-alpha.4"
tauri-runtime-wry = "3.0.0-alpha.5"
tauri-plugin-dialog = "3.0.0-alpha.4"
tauri-plugin-clipboard-manager = "3.0.0-alpha.3"
tauri-plugin-global-shortcut = "3.0.0-alpha.3"
tauri-plugin-log = "3.0.0-alpha.3"
# Extensions share this transport with the host; never attach a shared cookie jar.
tauri-plugin-http = { version = "3.0.0-alpha.3", default-features = false, features = ["http2", "charset", "system-proxy"] }
tauri-plugin-os = "3.0.0-alpha.3"
tauri-plugin-notification = "3.0.0-alpha.3"
tauri-plugin-opener = "3.0.0-alpha.3"
tauri-plugin-shell = "3.0.0-alpha.3"
tauri-plugin-autostart = "3.0.0-alpha.3"
tauri-plugin-process = "3.0.0-alpha.3"
tauri-plugin-single-instance = { version = "3.0.0-alpha.3", features = ["deep-link"] }
tauri-plugin-deep-link = "3.0.0-alpha.3"
tauri-plugin-updater = { version = "3.0.0-alpha.3", default-features = false, features = ["system-proxy"] }
tauri-plugin-window-state = "3.0.0-alpha.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
base64 = "0.23"
arboard = { version = "3.7", features = ["wayland-data-control"] }
semver = "1"
sys-locale = "0.3"
tokio = { version = "1", features = ["sync", "time", "macros"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSNotification", "NSGeometry"] }
# Tauri 3 adaptation of tauri-nspanel v2.1.1; see patches/tauri-nspanel/MIGRATION.md.
tauri-nspanel = { path = "patches/tauri-nspanel" }
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSResponder", "NSGraphics", "NSScreen"] }

objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer", "CAShapeLayer", "CATransaction", "objc2-core-foundation", "objc2-core-graphics"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGAffineTransform", "CGGeometry", "CGPath"] }

[target.'cfg(target_os = "windows")'.dependencies]
alwith-chat = { version = "0.6.5", default-features = false, features = ["native-network"] }
tauri-plugin-decoration = "3"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_Media_Audio", "Win32_Devices_HumanInterfaceDevice", "Win32_UI_Input", "Win32_UI_Shell"] }
window-vibrancy = "0.8"
raw-window-handle = "0.6"

# Exclude third-party adaptation snapshots from our workspace to avoid formatting them; the root package joins automatically.
[workspace]
resolver = "3"
exclude = ["patches/tauri-nspanel", "patches/wry", "patches/tauri-plugin-decoration", "patches/tauri-plugin-single-instance"]

[patch.crates-io]
# Unify module plugins with the installed Runtime SDK.
alwith-api = { path = "../node_modules/@alwith/api/rust" }
# Temporary WebKit race fix; removal is tracked in patches/wry/PATCH.md.
wry = { path = "patches/wry" }
tauri-plugin-single-instance = { path = "patches/tauri-plugin-single-instance" }
tauri-plugin-decoration = { path = "patches/tauri-plugin-decoration" }

[profile.dev]
debug = "line-tables-only"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# No `panic = "abort"`: wry and tauri-nspanel catch AppKit exceptions with objc2::exception::catch
# (e.g. a WKURLSchemeTask that WebKit already stopped), and that only works if the exception can
# unwind through their Rust frames. Under abort every such exception kills the app.
# The source is public, so symbols are not hidden: function names stay in the binary (crash
# reports and panic.log name the frame), and file:line tables go to a separate alwith-u.dSYM /
# alwith_u.pdb that the release workflow attaches to each release for `atos` lookups.
debug = "line-tables-only"
split-debuginfo = "packed"
strip = "debuginfo"
