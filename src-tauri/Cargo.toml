[package]
name = "alwith-u"
version = "0.2.6"
description = "An independent desktop client for the OpenAI Codex CLI"
authors = ["alwith.ai"]
license = "Apache-2.0"
edition = "2024"

[lib]
name = "alwith_u_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "3.0.0-alpha.3", features = [] }

[features]
hasgard-testing = ["dep:tauri-plugin-hasgard"]

[dependencies]
alwith-drive = { path = "../node_modules/@alwith/module-drive/rust" }
alwith-fs = { path = "../node_modules/@alwith/module-fs/rust", default-features = false, features = ["workspace"] }
alwith-api = { path = "../node_modules/@alwith/api/rust" }
alwith-extension = { path = "../node_modules/@alwith/module-extension/rust", features = ["tauri", "native-http"] }
tempfile = "3"
sha2 = "0.11"
hex = "0.4"
tauri-plugin-hasgard = { version = "^0.6.0-alpha.2", optional = true }
libloading = "0.9"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# reqwest 0.13 renamed the TLS feature from `rustls-tls` to `rustls`.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
# Tauri 3 keeps its runtime in a separate crate; alpha.4 provides transparency without a private-API feature.
tauri = { version = "3.0.0-alpha.4", features = ["protocol-asset", "specta"] }
specta = { version = "=2.0.0-rc.25", features = ["derive", "function"] }
tauri3-specta = "0.1.0-alpha.1"
tauri-runtime-wry = "3.0.0-alpha.4"
tauri-plugin-dialog = "3.0.0-alpha.3"
tauri-plugin-global-shortcut = "3.0.0-alpha.2"
tauri-plugin-log = "3.0.0-alpha.2"
# Extensions share this transport with the host; never attach a shared cookie jar.
tauri-plugin-http = { version = "3.0.0-alpha.2", default-features = false, features = ["rustls-tls", "http2", "charset", "system-proxy"] }
tauri-plugin-os = "3.0.0-alpha.2"
tauri-plugin-notification = "3.0.0-alpha.2"
tauri-plugin-opener = "3.0.0-alpha.2"
tauri-plugin-shell = "3.0.0-alpha.2"
tauri-plugin-store = "3.0.0-alpha.2"
tauri-plugin-process = "3.0.0-alpha.2"
tauri-plugin-single-instance = { version = "3.0.0-alpha.2", features = ["deep-link"] }
tauri-plugin-deep-link = "3.0.0-alpha.2"
tauri-plugin-updater = "3.0.0-alpha.2"
tauri-plugin-window-state = "3.0.0-alpha.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
base64 = "0.23"
minisign-verify = "0.3"
semver = "1"
sys-locale = "0.3"
tokio = { version = "1", features = ["sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSNotification", "NSGeometry"] }
# Tauri 3 adaptation of tauri-nspanel v2.1.1; see patches/tauri-nspanel/MIGRATION.md.
tauri-nspanel = { path = "patches/tauri-nspanel" }
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSResponder", "NSGraphics"] }

objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer", "CAShapeLayer", "CATransaction", "objc2-core-foundation", "objc2-core-graphics"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGAffineTransform", "CGGeometry", "CGPath"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_Media_Audio"] }
window-vibrancy = "0.8"
raw-window-handle = "0.6"

# Exclude third-party adaptation snapshots from our workspace to avoid formatting them; the root package joins automatically.
[workspace]
resolver = "3"
exclude = ["patches/tauri-nspanel"]

[profile.dev]
debug = "line-tables-only"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
