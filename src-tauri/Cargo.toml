[package]
name = "alwith-u"
version = "0.1.2"
description = "An independent desktop client for the OpenAI Codex CLI"
authors = ["alwith.ai"]
license = "Apache-2.0"
edition = "2024"

[lib]
name = "alwith_u_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "3.0.0-alpha.2", features = [] }

[features]
hasgard-testing = ["dep:tauri-plugin-hasgard"]

[dependencies]
alwith-api = { path = "../node_modules/@alwith/api/rust" }
alwith-extension = { path = "../node_modules/@alwith/module-extension/rust", features = ["tauri", "native-http"] }
tempfile = "3"
sha2 = "0.10"
tauri-plugin-hasgard = { version = "^0.6.0-alpha.2", optional = true }
libloading = "0.9"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# reqwest 0.13 renamed the TLS feature from `rustls-tls` to `rustls`.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
# Tauri 3: runtime is a separate crate; enable `macos-private-api` on the runtime crate (which also enables it on tauri).
tauri = { version = "3.0.0-alpha.3", features = ["protocol-asset"] }
tauri-runtime-wry = { version = "3.0.0-alpha.3", features = ["macos-private-api"] }
tauri-plugin-dialog = "3.0.0-alpha.1"
tauri-plugin-global-shortcut = "3.0.0-alpha.1"
tauri-plugin-log = "3.0.0-alpha.1"
# Extensions share this transport with the host; never attach a shared cookie jar.
tauri-plugin-http = { version = "3.0.0-alpha.1", default-features = false, features = ["rustls-tls", "http2", "charset", "system-proxy"] }
tauri-plugin-os = "3.0.0-alpha.1"
tauri-plugin-notification = "3.0.0-alpha.1"
tauri-plugin-opener = "3.0.0-alpha.1"
tauri-plugin-shell = "3.0.0-alpha.1"
tauri-plugin-store = "3.0.0-alpha.1"
tauri-plugin-process = "3.0.0-alpha.1"
tauri-plugin-single-instance = "3.0.0-alpha.1"
tauri-plugin-updater = "3.0.0-alpha.1"
tauri-plugin-window-state = "3.0.0-alpha.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
base64 = "0.23"
minisign-verify = "0.3"
semver = "1"
sys-locale = "0.3"
tokio = { version = "1", features = ["sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSNotification", "NSGeometry"] }
# Same Tauri 3 adaptation snapshot as Desktop (upstream a3122e894383aa068ec5365a42994e3ac94ba1b6; see patches/tauri-nspanel/MIGRATION.md).
tauri-nspanel = { path = "patches/tauri-nspanel" }
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSResponder", "NSGraphics"] }

# Exclude third-party adaptation snapshots from our workspace to avoid formatting them; the root package joins automatically.
[workspace]
resolver = "3"
exclude = ["patches/tauri-nspanel"]

# Fix the missing `Manager` import in the official alpha.1 plugins when compiling against tauri alpha.3; shared with Desktop.
# Remove once the upstream fixes (dialog #3655, updater #3653) are merged and released.
[patch.crates-io]
tauri-plugin-dialog = { path = "patches/tauri-plugin-dialog" }
tauri-plugin-updater = { path = "patches/tauri-plugin-updater" }

[profile.dev]
debug = "line-tables-only"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
