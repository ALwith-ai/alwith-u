name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun scripts/check-toolchain.ts
      - run: bun install --frozen-lockfile
      - run: bun check --no-script -b
      - run: bun run test -- --reporter=junit --outputFile=test-results.xml
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results.xml
          if-no-files-found: ignore
      - run: bun run build
      - run: bun run storybook:check
      - run: bunx --bun playwright install --with-deps chromium
      - run: bun run storybook:test

  desktop-public-dependencies:
    # Expand when additional Runtime targets are actually published. Native npm
    # libraries already cover six targets; don't pretend Runtime does yet.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun scripts/check-toolchain.ts
      - uses: dtolnay/rust-toolchain@stable
      # Cargo resolves alwith-api from node_modules/@alwith/api/rust, so the npm
      # install must precede anything that reads the Cargo manifest.
      - run: bun install --frozen-lockfile
      - name: Configure enterprise source access
        run: bun scripts/enterprise-git-auth.ts
        env:
          ENTERPRISE_GIT_READ_TOKEN: ${{ secrets.ENTERPRISE_GIT_READ_TOKEN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun run stage
      - run: bun run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - run: bun tauri build --no-bundle

  windows-staging:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun scripts/check-toolchain.ts
      - uses: dtolnay/rust-toolchain@stable
      - run: bun install --frozen-lockfile
      - run: bun run stage
      - run: bun scripts/verify-staged-toolchain.ts
