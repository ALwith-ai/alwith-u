name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run lint
      - run: bun run build

  desktop-public-dependencies:
    # Expand when additional Runtime targets are actually published. Native npm
    # libraries already cover six targets; don't pretend Runtime does yet.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - run: bun run stage
      - run: bun run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - run: bun run tauri build --no-bundle
