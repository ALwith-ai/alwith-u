[build]
# Panic reports need unwind metadata even when release panics abort the process.
rustflags = ["-C", "force-unwind-tables=yes"]

[env]
MACOSX_DEPLOYMENT_TARGET = { value = "26.0", force = true }
ALWITH_NATIVE_DIRECTORY = { value = "src-tauri/resources/native", relative = true }

[net]
# Use the developer or build runner Git credential helper for private source dependencies.
git-fetch-with-cli = true
